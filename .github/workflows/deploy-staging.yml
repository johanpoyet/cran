name: Deploy staging

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/shared/**
      - packages/config/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .dockerignore
      - .github/workflows/deploy-staging.yml
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cran-api
  STAGING_URL: https://api-staging.cran.johanpoyet.fr

jobs:
  image:
    name: Build and push API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    name: Deploy to staging
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    environment:
      name: staging
      url: ${{ env.STAGING_URL }}/docs
    steps:
      - name: Check deployment is configured
        id: config
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_STAGING_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::Secret DOKPLOY_STAGING_WEBHOOK_URL is not set: image pushed, staging not redeployed (see docs/runbook.md)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Dokploy redeploy
        if: steps.config.outputs.configured == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_STAGING_WEBHOOK_URL }}
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' "$WEBHOOK_URL" > /dev/null
          echo "Redeploy requested."

      - name: Wait for the new version on /health
        if: steps.config.outputs.configured == 'true'
        run: |
          for i in $(seq 1 40); do
            body=$(curl -fsS --max-time 5 "$STAGING_URL/health" || true)
            version=$(echo "$body" | jq -r '.version // empty' 2>/dev/null || true)
            echo "attempt $i: ${version:-no answer}"
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "$body" | jq .
              echo "$body" | jq -e '.database.status == "up"'
              exit 0
            fi
            sleep 6
          done
          echo "::error::Staging did not report version $GITHUB_SHA within 4 minutes."
          exit 1
