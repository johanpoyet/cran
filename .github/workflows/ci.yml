name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cran
          POSTGRES_PASSWORD: cran
          POSTGRES_DB: cran_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cran -d cran_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TURBO_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgres://cran:cran@localhost:5432/cran_test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
